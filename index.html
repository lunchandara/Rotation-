<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cambodian PPSHV Expressway Co., Ltd. - Staff Rotation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Kantumruy Pro', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-10">

  <!-- Header Section -->
  <header class="bg-[#0B2F64] text-white p-4 shadow-lg sticky top-0 z-30">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-white rounded-lg p-1 flex items-center justify-center shadow">
          <span class="text-[#0B2F64] font-bold text-xl">H</span>
        </div>
        <div>
          <h1 class="font-bold text-sm tracking-wide leading-tight">CAMBODIAN PPSHV</h1>
          <p class="text-[10px] text-amber-400 font-medium">EXPRESSWAY CO., LTD.</p>
        </div>
      </div>
      <button onclick="toggleAdminMode()" id="adminBtn" class="bg-amber-500 hover:bg-amber-600 text-[#0B2F64] font-bold px-3 py-1.5 rounded-lg text-xs transition-all flex items-center gap-1 shadow">
        🔒 Staff
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- Action Bar -->
    <div class="bg-white rounded-xl p-3 shadow-sm border border-slate-200 flex justify-between items-center">
      <div>
        <p class="text-xs text-slate-500">កាលវិភាគថ្ងៃនេះ</p>
        <p id="currentDateText" class="text-sm font-bold text-[#0B2F64]"></p>
      </div>
      <div class="flex gap-2">
        <button onclick="rotateDesks()" class="bg-[#0B2F64] text-white px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-blue-900 transition flex items-center gap-1">
          🔄 ផ្លាស់ប្តូរវេន
        </button>
      </div>
    </div>

    <!-- Desk List -->
    <div class="space-y-3" id="deskContainer">
      <!-- Desks rendered via JS -->
    </div>

  </main>

  <script>
    // Updated Desks List with exact names requested
    const defaultDesks = [
      { id: 1, name: 'កែផ្លាកលេខ', staff: 'សុខា', role: 'បុគ្គលិក', isFixed: true },
      { id: 2, name: 'ទូA', staff: 'ដារ៉ា', role: 'បុគ្គលិក', isFixed: false },
      { id: 3, name: 'ទូB', staff: 'វ៉ាន់នី', role: 'បុគ្គលិក', isFixed: false },
      { id: 4, name: 'ទូC', staff: 'ម៉ៅ', role: 'បុគ្គលិក', isFixed: false },
      { id: 5, name: 'សវនកម្ម', staff: 'ណារី', role: 'បុគ្គលិក', isFixed: false },
      { id: 6, name: 'ទូស្ថានីយ៍', staff: 'ទីណា', role: 'បុគ្គលិក', isFixed: false },
      { id: 7, name: 'Excel', staff: 'បូរី', role: 'បុគ្គលិក', isFixed: false }
    ];

    let desks = JSON.parse(localStorage.getItem('expressway_desks')) || defaultDesks;
    let isAdmin = false;

    function saveState() {
      localStorage.setItem('expressway_desks', JSON.stringify(desks));
      renderDesks();
    }

    function renderDesks() {
      const container = document.getElementById('deskContainer');
      container.innerHTML = '';

      desks.forEach((desk, idx) => {
        const card = document.createElement('div');
        card.className = `bg-white rounded-xl p-4 shadow-sm border ${desk.isFixed ? 'border-amber-400 bg-amber-50/30' : 'border-slate-200'} flex items-center justify-between transition-all`;
        
        card.innerHTML = `
          <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl ${desk.isFixed ? 'bg-amber-500 text-white' : 'bg-[#0B2F64] text-white'} flex items-center justify-center font-bold text-sm shadow-sm">
              ${idx + 1}
            </div>
            <div>
              <div class="flex items-center gap-2">
                <span class="font-bold text-[#0B2F64] text-base">${desk.name}</span>
                ${desk.isFixed ? '<span class="bg-amber-100 text-amber-800 text-[10px] font-semibold px-2 py-0.5 rounded-full border border-amber-300">🔒 តុថេរ</span>' : ''}
              </div>
              <p class="text-xs text-slate-600 font-medium">${desk.staff} • <span class="text-slate-400">${desk.role}</span></p>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function rotateDesks() {
      const fixedDesk = desks[0];
      const rotatingDesks = desks.slice(1);
      
      const last = rotatingDesks.pop();
      rotatingDesks.unshift(last);

      const newStaffList = [fixedDesk.staff, ...rotatingDesks.map(d => d.staff)];
      const newRolesList = [fixedDesk.role, ...rotatingDesks.map(d => d.role)];

      desks.forEach((d, i) => {
        d.staff = newStaffList[i];
        d.role = newRolesList[i];
      });

      saveState();
    }

    function toggleAdminMode() {
      isAdmin = !isAdmin;
      const btn = document.getElementById('adminBtn');
      btn.innerHTML = isAdmin ? '🔓 Admin' : '🔒 Staff';
      btn.className = isAdmin 
        ? 'bg-emerald-500 hover:bg-emerald-600 text-white font-bold px-3 py-1.5 rounded-lg text-xs transition-all flex items-center gap-1 shadow'
        : 'bg-amber-500 hover:bg-amber-600 text-[#0B2F64] font-bold px-3 py-1.5 rounded-lg text-xs transition-all flex items-center gap-1 shadow';
    }

    document.getElementById('currentDateText').innerText = new Date().toLocaleDateString('km-KH', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    renderDesks();
  </script>
</body>
</html>
